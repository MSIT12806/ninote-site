<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1713" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Intugrove 是一套以本機 Markdown 為根的 Windows 知識工作工具，讓 Block、連結、模板與多種 View 共同長成可追蹤的思維林地。"
    />
    <link rel="icon" type="image/png" href="./intugrove-logo.png" />
    <title>Intugrove｜讓知識彼此扎根</title>
    <script>
      (() => {
        const saved = localStorage.getItem('ninote-theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#0e1713' : '#f7f3e9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>

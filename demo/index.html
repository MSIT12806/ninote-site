<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1713" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="由整合測試錄製的真實 Intugrove Windows Desktop 畫面，呈現 NiMode、Rendered Mode 與 Source Mode。" />
    <link rel="icon" type="image/png" href="../intugrove-logo.png" />
    <title>Intugrove 真實產品畫面</title>
    <script>
      (() => {
        const saved = localStorage.getItem('ninote-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0e1713' : '#f7f3e9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/demo.tsx"></script>
  </body>
</html>
